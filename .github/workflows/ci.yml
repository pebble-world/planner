name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Manual trigger so the integration sweep can be run on a branch before it
  # merges (Actions -> CI -> Run workflow). Runs every job.
  workflow_dispatch:

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  integration-windows:
    name: integration (windows)
    runs-on: windows-latest
    # Integration sweep (#117). PRs into develop only run `verify` (local runs
    # cover just the files a change touches), so the full suite runs post-merge
    # on every push to develop, on the develop -> main release PR, and on manual
    # dispatch. Skipped on PRs into develop and on pushes to main.
    # Keep this condition in sync with integration-android.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install example dependencies
        run: flutter pub get
        working-directory: example

      - name: Run integration tests on Windows
        # Target the single consolidated entry point explicitly rather than the
        # whole directory: integration_test/ also holds screenshots_test.dart, a
        # standalone documentation-capture target that must not run as part of
        # the suite (it writes PNGs and pumps its own widget trees).
        run: flutter test integration_test/app_test.dart -d windows
        working-directory: example

  integration-android:
    name: integration (android)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Same gating as integration-windows (#117). A phone-sized portrait emulator
    # catches the viewport class of failures a desktop window hides (#115).
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        # Hardware acceleration for the x86_64 emulator on ubuntu-latest, per
        # reactivecircus/android-emulator-runner's README.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java 17
        # The example's Android project (Gradle 9.3.1, AGP 9.1.0; #114) needs
        # JDK 17.
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install example dependencies
        run: flutter pub get
        working-directory: example

      - name: Run integration tests on Android emulator
        # API 35 phone profile in its default portrait orientation. Animations
        # are left on to match a local AVD run. As on Windows, target
        # app_test.dart explicitly so screenshots_test.dart never runs.
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          working-directory: example
          script: flutter test integration_test/app_test.dart -d emulator-5554
